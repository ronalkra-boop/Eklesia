<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Glowing Accent -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  
  <!-- Subtle Outer Rim -->
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />
  
  <!-- Subtle Radial Aura -->
  <circle cx="256" cy="225" r="140" fill="#f59e0b" opacity="0.07" filter="url(#goldGlow)" />

  <!-- MAIN CHURCH + PESO EMBLEM -->
  <g id="church-peso-fusion">
    <!-- Church Roof / Gable Arch (Outer Cathedral Silhouette) -->
    <path d="M120,330 L120,205 L256,92 L392,205 L392,330" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Church Sanctuary Flying Buttresses / Side Pillars -->
    <line x1="168" y1="245" x2="168" y2="330" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <line x1="344" y1="245" x2="344" y2="330" stroke="#475569" stroke-width="6" stroke-linecap="round" />

    <!-- Central Belfry / Steeple base arch -->
    <path d="M216,126 L216,80 L256,48 L296,80 L296,126" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="8" 
          stroke-linejoin="round" />

    <!-- HOLY CROSS (Tower Peak & Spire) -->
    <!-- Cross vertical arm extending upwards -->
    <line x1="256" y1="20" x2="256" y2="52" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
    <!-- Cross horizontal arm -->
    <line x1="240" y1="34" x2="272" y2="34" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />

    <!-- THE PESO SIGN ($) EMBODIED THROUGH THE CHURCH'S HEART -->
    <!-- Two vertical golden treasury pillars that pierce the central S-curve, representing the classic peso/dollar double vertical stroke & the church's sacred pillars -->
    <line x1="242" y1="130" x2="242" y2="330" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <line x1="270" y1="130" x2="270" y2="330" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- Stylized S-curve of the PESO symbol intertwining with the church portal and arches -->
    <path d="M305,178 
             C295,152 265,142 245,148 
             C218,156 210,182 225,206 
             C240,228 290,236 295,264 
             C300,290 280,314 246,316 
             C222,317 198,302 195,282" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Altar / Church Foundation Steps (Solid ground) -->
    <path d="M100,342 L412,342" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M136,356 L376,356" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- TYPOGRAPHY / IDENTIFIER -->
  <text x="256" y="420" 
        text-anchor="middle" 
        fill="#f8fafc" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="36" 
        letter-spacing="5">EKKLESIA</text>
        
  <text x="256" y="454" 
        text-anchor="middle" 
        fill="#eab308" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="700" 
        font-size="18" 
        letter-spacing="4">TESORERÍA ECLESIAL</text>
</svg>
